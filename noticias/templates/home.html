<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Notícias</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .filtro {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .btn {
            padding: 8px 14px;
            background-color: #2c7be5;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1a5fb4;
        }

        .noticia {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .noticia h2 {
            margin-top: 0;
        }

        .info {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .url {
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Notícias</h1>

    <div class="topo">
        <!-- Filtro por categoria -->
        <form method="GET" class="filtro">
            <input 
                type="text" 
                name="categoria" 
                placeholder="Filtrar por categoria"
                value="{{ request.GET.categoria }}"
            >
            <button type="submit" class="btn">Filtrar</button>
        </form>

        <!-- Botão criar -->
        <a href="/criar/" class="btn">Criar Notícia</a>
    </div>

    {% for noticia in noticias %}
        <div class="noticia">
            <h2>{{ noticia.titulo }}</h2>

            <p class="info">
                {{ noticia.categoria }} | {{ noticia.autor }} | {{ noticia.data_noticia }} | {{ noticia.fonte }}
            </p>

            <p>{{ noticia.subtitulo }}</p>

            <p class="url">
                <a href="{{ noticia.url_noticia }}" target="_blank">
                    {{ noticia.url_noticia }}
                </a>
            </p>
        </div>
    {% empty %}
        <p>Nenhuma notícia encontrada.</p>
    {% endfor %}

</body>
</html>
